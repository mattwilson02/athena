services:
  proxy:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: athena-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"            # Loopback only — NOT reachable from LAN
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/secrets:/secrets:ro          # Auth token for API proxy
    depends_on:
      - athena
      - frontend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
    networks:
      - proxy-net
      - athena-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: athena-frontend
    restart: unless-stopped
    networks:
      - athena-net                        # Internal only — no internet, no published ports
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5

  athena:
    build: ./backend
    container_name: athena
    restart: unless-stopped
    # NO ports published — only reachable via proxy on athena-net
    environment:
      - VAULT_PATH=/vault
      - CONFIG_PATH=/config/config.yaml
      - FLASK_ENV=production
    volumes:
      - ./vault:/vault:rw                      # Knowledge graph
      - athena-chroma:/app/chroma_db:rw        # Vector DB (named volume for SQLite compat)
      - athena-sessions:/app/chat_sessions:rw  # Chat history
      - ./deployment/config:/config:ro         # Config (read-only)
      - ./deployment/secrets:/secrets:ro       # Secrets (read-only)
      - ./SOUL.md:/app/SOUL.md:ro              # Personality (read-only)
      - athena-logs:/logs:rw                   # Audit logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2
    extra_hosts:
      - "host.docker.internal:host-gateway"    # Host access (debugging, future use)
    networks:
      - athena-net                             # Internal — communicates with proxy + frontend
      - gateway-net                            # External — reaches Claude API + host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  proxy-net:
    driver: bridge                             # Host-facing — proxy publishes port here
  athena-net:
    internal: true                             # Isolated — no internet, no port publishing
  gateway-net:
    driver: bridge                             # Backend reaches Claude API + host.docker.internal

volumes:
  athena-chroma:
  athena-sessions:
  athena-logs:
