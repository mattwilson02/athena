services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./vault:/app/vault
      - chroma_data:/app/chroma_db
    env_file:
      - ./backend/.env
    environment:
      - VAULT_PATH=/app/vault

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:5000

volumes:
  chroma_data:
